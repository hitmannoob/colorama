# Generated by Agensh from the project's acceptance checks; removed before delivery.
# Protected: changes need the team administrator.
name: agensh
on:
  pull_request:
  push:
    branches: [main]
env:
  AGENSH_MODEL_BASE: http://egress-proxy:4180/raw
defaults:
  run:
    shell: bash
jobs:
  pr:
    if: gitea.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "http://gitea:3000/${{ gitea.repository }}.git" "${{ gitea.ref }}"
          git checkout -q FETCH_HEAD
      - name: "check 1: pip install -q pytest -e . && python -m pytest -q"
        run: "pip install -q pytest -e . && python -m pytest -q"
  main:
    if: gitea.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "http://gitea:3000/${{ gitea.repository }}.git" "${{ gitea.ref }}"
          git checkout -q FETCH_HEAD
      - name: "check 1: pip install -q pytest -e . && python -m pytest -q"
        run: "pip install -q pytest -e . && python -m pytest -q"
